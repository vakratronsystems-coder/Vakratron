<script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('code') || window.location.hash.includes('access_token')) {
            localStorage.setItem('vakra_auth_token', 'SECURE_NODE_VALIDATED_2026');
            window.location.href = '/index.html'; 
        }

        // --- INTERACTIVE CHAT ENGINE FRONTEND ADAPTER ---
        const trigger = document.getElementById('chatTrigger');
        const windowEl = document.getElementById('chatWindow');
        const closeBtn = document.getElementById('chatClose');
        const sendBtn = document.getElementById('chatSend');
        const inputEl = document.getElementById('chatInput');
        const messagesContainer = document.getElementById('chatMessages');

     // Toggle Widget Interface Fix
        trigger.addEventListener('click', (e) => {
            e.stopPropagation(); // Global layouts ko trace capture karne se roko
            windowEl.classList.toggle('active');
            
            if(windowEl.classList.contains('active')) {
                windowEl.style.setProperty('display', 'flex', 'important');
                windowEl.style.setProperty('width', '360px', 'important');
                inputEl.focus();
            } else {
                windowEl.style.setProperty('display', 'none', 'important');
            }
        });

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            windowEl.classList.remove('active');
            windowEl.style.setProperty('display', 'none', 'important');
        });

        // Message Dispatcher Pipeline
        // Message Dispatcher Pipeline
        async function dispatchUserPrompt() {
            const promptValue = inputEl.value.trim();
            if (!promptValue) return;

            // Render User Bubble
            appendBubble(promptValue, 'user');
            inputEl.value = '';

            // Inject Streaming/Typing Matrix Indicator
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'vakra-msg system';
            typingIndicator.innerHTML = `<div class="vakra-typing"><span></span><span></span><span></span></div>`;
            messagesContainer.appendChild(typingIndicator);
            scrollToBottom();

            try {
                // Secure Fetch Request to local API Gateway Route
                const apiResponse = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: promptValue })
                });

                const dataset = await apiResponse.json();
                typingIndicator.remove(); // Evacuate typing trace

                if (apiResponse.ok && dataset.response) {
                    appendBubble(dataset.response, 'system');

                    // 🚨 NEXT-LEVEL AUTOMATED FRONTEND TRIGGER START
                    const lowerMessage = promptValue.toLowerCase();
                    if (
                        lowerMessage.includes('connect') || 
                        lowerMessage.includes('talk to human') || 
                        lowerMessage.includes('contact team') || 
                        lowerMessage.includes('representative') || 
                        lowerMessage.includes('connect someone') ||
                        lowerMessage.includes('team se connect')
                    ) {
                        setTimeout(() => {
                            appendBubble("⚡ System Action: Redirecting token matrix to the Sovereign Advisory Desk...", 'system');
                            
                            // 1.5 Seconds ka delay taaki user bot ka message padh sake, fir auto-redirect
                            setTimeout(() => {
                                window.location.href = 'contact.html';
                            }, 1500);
                        }, 1000);
                    }
                    // 🚨 NEXT-LEVEL AUTOMATED FRONTEND TRIGGER END

                } else {
                    appendBubble("Execution Defect: Unable to pipeline calculated tokens from LLM core.", 'system');
                }

            } catch (networkError) {
                if(typingIndicator) typingIndicator.remove();
                appendBubble("Network Fault: Endpoint connectivity degraded or blocked.", 'system');
                console.error("Pipeline Transmission Error:", networkError);
            }
        }

        function appendBubble(content, actor) {
            const bubble = document.createElement('div');
            bubble.className = `vakra-msg ${actor}`;
            // safe conversion, replace newlines with line-breaks for formatting comfort
            bubble.innerHTML = content.replace(/\n/g, '<br>');
            messagesContainer.appendChild(bubble);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Trigger Listeners Setup
        sendBtn.addEventListener('click', dispatchUserPrompt);
        inputEl.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') dispatchUserPrompt();
        });
    </script>
