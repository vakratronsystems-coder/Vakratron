name: Daily SEO Agent Audit

on:
  schedule:
    # Roz subah 8:00 AM IST par automatically chalega
    - cron: '30 2 * * *'
  workflow_dispatch: # Direct manual trigger button

jobs:
  run-seo-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run Daily SEO Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: node seo_agent.mjs